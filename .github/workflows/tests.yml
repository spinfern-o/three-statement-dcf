name: tests

# Runs on PRs and on pushes to main. Scoping push to main avoids a duplicate
# run on every PR branch, since the pull_request event already covers those.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every version here was verified against the suite before being listed.
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        # Paths come from pytest.ini: the engine and the website backend.
        # The browser suite skips here and runs in its own job below.
        run: python -m pytest -q

  # Item 49 / specification 22.7: the keyboard and screen-reader workflows need
  # a real browser, so they get one job rather than four. A skip that never
  # un-skips is not a test, which is why this is not left to the matrix.
  accessibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run the accessibility suite
        run: |
          python -m pytest apps/api/tests/integration/test_accessibility.py \
            -q --junitxml=accessibility.xml

      - name: Fail if the suite skipped instead of running
        # A skip that never un-skips is not a test. This job exists to run the
        # browser workflows, so a green run with zero of them is a failure.
        run: |
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          suite = ET.parse("accessibility.xml").getroot().find("testsuite")
          ran = int(suite.get("tests")) - int(suite.get("skipped"))
          print(f"{ran} accessibility test(s) actually ran")
          sys.exit(0 if ran > 0 else 1)
          PY

  # Item 152 / specification 20.20: "Complete dependency and vulnerability
  # scans before production release." Run on every commit rather than before a
  # release, because a vulnerability disclosed today is in the tree today, and
  # a gate that only runs at release time reports it at the worst moment.
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install pip-audit

      - name: Audit the dependency tree
        # pip-audit queries the Python Packaging Advisory Database, and this
        # audits THIS PROJECT'S declared requirements and everything they pull
        # in -- a transitive dependency is as present as a direct one.
        #
        # Scoped to the requirements files rather than `--strict` over the
        # whole environment, which sweeps in whatever the base image ships:
        # the first run failed on `python-apt`, an Ubuntu system package that
        # is not on PyPI and cannot be audited. The claim worth making is that
        # this project's dependencies carry no known vulnerability, not that
        # the runner's operating system does not.
        run: |
          python -m pip_audit --strict --progress-spinner off \
            -r requirements.txt -r requirements-dev.txt

      - name: Check for a source PDF or a secret in the tree
        # Item 166 and 20.4. Written here rather than left to a release
        # checklist: a secret committed today is compromised from that commit,
        # and finding it at release time is finding it too late.
        run: python -m apps.api.app.security.repository_scan

  # Items 154 and 155. Its own job rather than a step in `test`, so a lint
  # failure and a test failure are distinguishable at a glance and neither
  # hides the other.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint (item 154)
        # Rules and exclusions are in pyproject.toml, each with its reason.
        run: python -m ruff check .

      - name: Formatting (item 154)
        # `--diff` rather than `--check`: a failure prints what it would
        # change, which is the difference between a red job and an actionable
        # one.
        run: python -m ruff format --diff .

      - name: Type check (item 155)
        # Strict over model/, the arithmetic core. Checked but not strict over
        # apps/api/app, which sits on untyped third-party libraries -- see the
        # note in pyproject.toml.
        run: python -m mypy

  # Item 168. The report is a generated artefact, and one committed once and
  # never regenerated is worse than none: it reads as current. This job
  # regenerates it and fails when the committed copy has drifted, which is how
  # the test count in README.md stopped being wrong three times in one day.
  #
  # `--fast` skips the two browser suites, which have their own job above. The
  # report then reports them NOT RUN, and a NOT RUN row blocks its verdict --
  # so this job checks the drift, and the `accessibility` job checks the
  # browser, and neither pretends to be the other.
  release-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Regenerate the release-readiness report
        # Non-zero is expected under --fast, because two suites are NOT RUN.
        # What must not change is the committed report's content.
        run: |
          python -m apps.api.app.verification.report --fast \
            --out /tmp/release-readiness.md || true

      - name: Fail if the committed report has drifted
        run: |
          python - <<'PY'
          import re, sys
          from pathlib import Path

          def rows(text):
              # The generated-at line and the timings differ every run and are
              # not drift. Everything else is.
              text = re.sub(r"Generated at: `[^`]+`", "", text)
              text = re.sub(r"\| [\d.]+ \|$", "|", text, flags=re.MULTILINE)
              kept = []
              for line in text.splitlines():
                  if line.startswith("| 22."):
                      kept.append(line)
                  elif line.startswith("| 24."):
                      # Section 24's Result column is DERIVED from the gates,
                      # and --fast does not run two of them -- so 24.15 and
                      # 24.16 legitimately read NOT RUN here and PASS in the
                      # committed full run. That is the feature, not drift.
                      # What must not drift is the evidence each criterion
                      # names, so the result cell is dropped and the rest
                      # compared.
                      kept.append(re.sub(r"\*\*(PASS|FAIL|NOT RUN|UNEVIDENCED)\*\*",
                                         "**-**", line))
              return kept

          committed = rows(Path("docs/release-readiness.md").read_text())
          fresh = rows(Path("/tmp/release-readiness.md").read_text())
          if committed != fresh:
              print("docs/release-readiness.md has drifted from the suite.")
              print("Regenerate it: python3 -m apps.api.app.verification.report "
                    "--out docs/release-readiness.md")
              sys.exit(1)
          print(f"{len(committed)} Section 22 and 24 row(s) match the committed report")
          PY
