name: tests

# Runs on PRs and on pushes to main. Scoping push to main avoids a duplicate
# run on every PR branch, since the pull_request event already covers those.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every version here was verified against the suite before being listed.
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        # Two trees: tests/ is the calculation engine (the 37-step workflow),
        # apps/api/tests/ is PDF ingestion (Phase 3 of the website spec).
        run: python -m pytest tests/ apps/api/tests/ -q
