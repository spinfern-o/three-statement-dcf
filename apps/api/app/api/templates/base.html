<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ product_name }}{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>

  <header class="topbar">
    <span class="wordmark">{{ product_name }}</span>
    <span class="context">{% block context %}{% endblock %}</span>
    <nav aria-label="Primary" style="margin-left:auto">
      <a href="/">All documents</a>
    </nav>
  </header>

  {% block body %}{% endblock %}

  <footer>
    {{ owner }} &middot; {{ footer }}
    <br>
    Scenario forecasts are not facts or guarantees, and nothing here is
    investment advice (specification 1.19, 1.20).
  </footer>
</body>
</html>
